  <text x="144" y="248" fill="#34d399" font-family="monospace" font-size="12">"status": "success",</text>
  <text x="144" y="274" fill="#93c5fd" font-family="monospace" font-size="12">"meta": { "semester": "2026-Ganjil" },</text>
  <text x="144" y="300" fill="#e4e4e7" font-family="monospace" font-size="12">"conflict_check": "PASSED",</text>
  <text x="144" y="326" fill="#fcd34d" font-family="monospace" font-size="12">"eloquent_queries": 2,</text>
  <text x="144" y="352" fill="#34d399" font-family="monospace" font-size="12">"eager_loaded": ["lecturer", "room"]</text>
  <text x="124" y="378" fill="#e4e4e7" font-family="monospace" font-size="12">}</text>

  <!-- Right ERD Nodes -->
  <rect x="512" y="124" width="348" height="114" rx="12" fill="#141d26" stroke="#10b981" stroke-opacity="0.5" />
  <text x="536" y="154" fill="#34d399" font-family="monospace" font-weight="bold" font-size="13">TABLE: course_schedules</text>
  <text x="536" y="180" fill="#d4d4d8" font-family="monospace" font-size="11">PK id (bigint) • FK course_id • FK room_id</text>
  <text x="536" y="204" fill="#a1a1aa" font-family="monospace" font-size="11">INDEX idx_room_timeslot (Unique Constraint)</text>

  <path d="M686 238 V276" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" />

  <rect x="512" y="276" width="348" height="114" rx="12" fill="#141c24" stroke="#27272a" />
  <text x="536" y="306" fill="#f4f4f5" font-family="monospace" font-weight="bold" font-size="13">TABLE: attendance_logs</text>
  <text x="536" y="332" fill="#d4d4d8" font-family="monospace" font-size="11">PK uuid • FK schedule_id • FK student_id</text>

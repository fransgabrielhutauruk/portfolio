  <rect x="512" y="414" width="348" height="100" rx="12" fill="#0f1f18" stroke="#10b981" stroke-opacity="0.4" />
  <text x="536" y="452" fill="#f4f4f5" font-family="sans-serif" font-weight="bold" font-size="16">Response Time Turun 78%</text>

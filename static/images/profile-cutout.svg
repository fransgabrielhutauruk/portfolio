<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" fill="none">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#059669" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="portraitLight" x1="210" y1="80" x2="490" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="45%" stop-color="#d4d4d8" />
      <stop offset="80%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="shadowSide" x1="330" y1="120" x2="470" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52525b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.78" />
    </linearGradient>
    <linearGradient id="jacketShade" x1="120" y1="450" x2="580" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="45%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="emeraldRim" x1="140" y1="90" x2="540" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Subtle Studio Backplate & Concentric Tech Rings -->
  <circle cx="350" cy="340" r="290" fill="url(#studioGlow)" />
  <circle cx="350" cy="340" r="235" stroke="#10b981" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="350" cy="340" r="185" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

  <!-- Editorial High-Contrast Cutout Bust (Monochrome Chiaroscuro + Emerald Rim Light) -->
  <!-- Shoulders & Structured Overshirt/Blazer -->
  <path d="M86 760C98 566 184 486 350 486C516 486 602 566 614 760H86Z" fill="url(#jacketShade)" />
  <!-- Inner Crewneck Tee -->
  <path d="M268 494C295 542 405 542 432 494L402 760H298L268 494Z" fill="#121316" />
  <path d="M276 496C306 534 394 534 424 496" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Tailored Jacket Lapels & Folds -->
  <path d="M236 492L294 690L322 615L268 486Z" fill="#1f2026" stroke="#3f3f46" stroke-width="1.5" />
  <path d="M464 492L406 690L378 615L432 486Z" fill="#141519" stroke="#27272a" stroke-width="1.5" />
  <path d="M90 760C104 570 186 488 350 488" stroke="url(#emeraldRim)" stroke-width="4" stroke-linecap="round" />

  <!-- Neck & Jaw Shadow -->
  <path d="M290 385H410V502C410 530 290 530 290 502V385Z" fill="url(#portraitLight)" />
  <path d="M290 392C320 442 382 442 410 398V465C375 492 318 488 290 455V392Z" fill="#09090b" fill-opacity="0.55" />


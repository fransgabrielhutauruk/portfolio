  <path d="M216 254C204 254 198 270 202 292C205 310 214 322 226 320V254H216Z" fill="#a1a1aa" />
  <path d="M484 254C496 254 502 270 498 292C495 310 486 322 474 320V254H484Z" fill="#52525b" />

  <!-- Sculpted Head & Editorial Dual-Tone Lighting -->
  <path d="M224 218C224 134 274 96 350 96C426 96 476 134 476 218V296C476 378 418 438 350 438C282 438 224 378 224 296V218Z" fill="url(#portraitLight)" />
  <!-- Right-side Dramatic Studio Shadow -->
  <path d="M350 96C426 96 476 134 476 218V296C476 378 418 438 350 438V96Z" fill="url(#shadowSide)" />
  <!-- Emerald Rim Highlight on Left Cheek & Jaw -->
  <path d="M225 218V296C225 368 272 424 334 436" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />

  <!-- Stylized Brows & Eyes behind Reflective Studio Eyewear -->
  <path d="M256 234C276 225 304 226 322 233" stroke="#18181b" stroke-width="7" stroke-linecap="round" />
  <path d="M378 233C396 226 424 225 444 234" stroke="#18181b" stroke-width="7" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="290" cy="264" rx="14" ry="8" fill="#18181b" />
  <circle cx="286" cy="262" r="3" fill="#ffffff" />
  <ellipse cx="410" cy="264" rx="14" ry="8" fill="#18181b" />
  <circle cx="406" cy="262" r="3" fill="#e4e4e7" />

  <!-- Sculpted Nose Bridge & Shadow -->
  <path d="M350 252L342 324L364 330" stroke="#52525b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M350 252L366 326H346" fill="#27272a" fill-opacity="0.35" />

  <!-- Confident Composed Expression -->
  <path d="M314 364C336 375 364 375 386 364" stroke="#27272a" stroke-width="5" stroke-linecap="round" />
  <path d="M332 382C344 386 356 386 368 382" stroke="#52525b" stroke-width="3" stroke-linecap="round" />

  <!-- Architectural Designer Glasses with Emerald Code Reflection -->
  <rect x="242" y="238" width="94" height="56" rx="14" fill="#09090b" fill-opacity="0.28" stroke="#f4f4f5" stroke-width="4" />
  <rect x="364" y="238" width="94" height="56" rx="14" fill="#09090b" fill-opacity="0.38" stroke="#d4d4d8" stroke-width="4" />
  <path d="M336 258H364" stroke="#f4f4f5" stroke-width="4" />
  <path d="M224 256L242 254" stroke="#d4d4d8" stroke-width="3.5" />
  <path d="M458 254L476 256" stroke="#a1a1aa" stroke-width="3.5" />
  <!-- Lens Glare Streaks -->
  <path d="M256 248L278 284" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <path d="M270 248L284 270" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M378 248L400 284" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />

  <!-- Layered Modern Two-Block Hair Silhouette -->
  <path d="M206 244C192 156 242 74 348 68C446 62 504 134 492 242C484 198 464 166 432 144C412 178 372 198 326 196C344 176 354 156 358 136C316 168 272 190 232 202C222 216 214 230 206 244Z" fill="#141418" />
  <path d="M210 218C206 146 252 78 348 70" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.65" />
